<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Dance BC | Pro Edition</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="video-overlay"></div>

    <div class="main-container">
        <header class="animate-drop">
            <div class="logo-area">
                <h1>ELECTRO DANCE <span class="highlight">BAJA CALIFORNIA</span></h1>
                   <div style="text-align: center;">
  <img src="img/LOGO.PNG" alt="ANGLE" style="width: 180px; height: auto;">
                <p class="subtitle">ESTADÍSTICAS OFICIALES DE COMPETENCIA</p>
            </div>
        </header>

        <section class="stats-table-container animate-fade-in">
            <table class="pro-table">
                <thead>
                    <tr>
                        <th>RANK</th>
                        <th>FOTO</th>
                        <th>BAILARÍN</th>
                        <th class="col-g4">G4</th>
                        <th class="col-gold">GOLD</th>
                        <th class="col-silver">SILVER</th>
                        <th class="col-open">ABIERTA</th>
                        <th class="col-total">TOTAL WINS</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Fila 1: CAMACHO -->
                    <tr class="row-animate">
                        <td><span class="rank-num">01</span></td>
                        <td>
                            <div class="pic-wrapper">
                                <img src="img/electro/CAMACHO.jpg" alt="Camacho" onerror="this.src='https://via.placeholder.com/80/003366/FFD700?text=Camacho'">
                            </div>
                        </td>
                        <td class="dancer-name">CAMACHO <small>MEX-KILL</small></td>
                        <td class="val">2</td>
                        <td class="val">0</td>
                        <td class="val">0</td>
                        <td class="val-special">3</td>
                        <td class="total-score">5</td>
                    </tr>

                    <!-- Fila 2: COYOT -->
                    <tr class="row-animate">
                        <td><span class="rank-num">02</span></td>
                        <td>
                            <div class="pic-wrapper">
                                <img src="img/electro/SHAVA.jpg" alt="SHAVA" onerror="this.src='https://via.placeholder.com/80/003366/FFD700?text=Coyot'">
                            </div>
                        </td>
                        <td class="dancer-name">SHAVA<small>DEM-REVELZ</small></td>
                        <td class="val">1</td>
                        <td class="val">0</td>
                        <td class="val">1</td>
                        <td class="val-special">1</td>
                        <td class="total-score">3</td>
                    </tr>

                    <!-- Fila 3: SPIRIT -->
                    <tr class="row-animate">
                        <td><span class="rank-num">03</span></td>
                        <td>
                            <div class="pic-wrapper">
                                <img src="img/electro/YOUNG.jpg" alt="Spirit" onerror="this.src='https://via.placeholder.com/80/003366/FFD700?text=Spirit'">
                            </div>
                        </td>
                        <td class="dancer-name">YOUNG <small>DEM-REVELZ</small></td>
                        <td class="val">0</td>
                        <td class="val">1</td>
                        <td class="val">0</td>
                        <td class="val-special">0</td>
                        <td class="total-score">1</td>
                    </tr>

                    <!-- Fila 4: VACNOR -->
                    <tr class="row-animate">
                        <td><span class="rank-num">04</span></td>
                        <td>
                            <div class="pic-wrapper">
                                <img src="img/electro/WEEKENZ.jpg" alt="WEEKENDZ" onerror="this.src='https://via.placeholder.com/80/003366/FFD700?text=Vacnor'">
                            </div>
                        </td>
                        <td class="dancer-name">WEEKENDZ <small>DEM-REVELZ</small></td>
                        <td class="val">0</td>
                        <td class="val">0</td>
                        <td class="val">0</td>
                        <td class="val-special">1</td>
                        <td class="total-score">1</td>
                    </tr>
                </tbody>
            </table>
        </section>
        
        <footer>
            <p>Diseño por Angle</p>
        </footer>
    </div>

</body>
</html>
